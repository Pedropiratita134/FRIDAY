name: Prototipo de ventana propia
# Compila y prueba la ventana propia de FRIDAY (WebKitGTK) en un escritorio de mentira, para
# contestar tres preguntas antes de hacerlo en serio: si la ventana lleva nuestra identidad (la
# barra de tareas), si podemos darle el micrófono desde el código, y si va a andar la música.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ventana/**', '.github/workflows/ventana.yml']
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }

      - name: Instalar el motor web del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config \
            xvfb x11-utils xdotool \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav
          pkg-config --modversion webkit2gtk-4.1

      - name: Compilar
        working-directory: ventana
        run: |
          CGO_ENABLED=1 go build -o friday-ventana .
          ls -la friday-ventana

      - name: Probarla en un escritorio de mentira
        working-directory: ventana
        run: |
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          sleep 2
          export DISPLAY=:99
          # en un servidor sin placa de video, WebKit se cae si intenta componer con la GPU
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          export LIBGL_ALWAYS_SOFTWARE=1
          ./friday-ventana > salida.txt 2>&1 &
          APP=$!
          sleep 12
          echo "=== La identidad de la ventana (esto es lo que mira la barra de tareas) ==="
          xdotool search --name FRIDAY 2>/dev/null | while read -r id; do xprop -id "$id" WM_CLASS WM_NAME 2>/dev/null || true; done
          xprop -root _NET_CLIENT_LIST 2>/dev/null | head -2 || true
          wait $APP || true
          echo
          cat salida.txt

      - name: Que quede el resultado a mano
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado
          path: |
            ventana/salida.txt
            ventana/resultado.json
          if-no-files-found: ignore

  elena:
    # ¿Se puede pedir Elena con el método simple y de toda la vida, sin librerías de nadie?
    # Si anda, lo implementamos nosotros (en el Worker) y no dependemos de ningún paquete.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probar el pedido a mano
        run: |
          cat > elena.mjs <<'EOF'
          import crypto from 'node:crypto';
          import WebSocket from 'ws';
          import fs from 'node:fs';
          const TOKEN = '6A5AA1D4EAFF4E9FB37E23D68491D6F4';
          const WIN_EPOCH = 11644473600, S_TO_NS = 1e9;
          function gec() {
            let t = Math.floor(Date.now() / 1000) + WIN_EPOCH;
            t -= t % 300;
            const v = String(t * (S_TO_NS / 100)) + TOKEN;
            return crypto.createHash('sha256').update(v).digest('hex').toUpperCase();
          }
          const id = crypto.randomUUID().replace(/-/g, '');
          const url = 'wss://speech.platform.bing.com/consumer/speech/synthesize/readaloud/edge/v1'
            + '?TrustedClientToken=' + TOKEN + '&Sec-MS-GEC=' + gec() + '&Sec-MS-GEC-Version=1-130.0.2849.68&ConnectionId=' + id;
          const ws = new WebSocket(url, { headers: {
            'Origin': 'chrome-extension://jdiccldimpdaibmpdkjnbmckianbfold',
            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36 Edg/130.0.0.0',
            'Pragma': 'no-cache', 'Cache-Control': 'no-cache',
          }});
          const trozos = []; let palabras = 0;
          const ts = () => new Date().toString();
          ws.on('open', () => {
            ws.send('X-Timestamp:' + ts() + '\r\nContent-Type:application/json; charset=utf-8\r\nPath:speech.config\r\n\r\n'
              + JSON.stringify({context:{synthesis:{audio:{metadataoptions:{sentenceBoundaryEnabled:'false',wordBoundaryEnabled:'true'},outputFormat:'audio-24khz-48kbitrate-mono-mp3'}}}}));
            const texto = 'Buen día, Pedro. Son las nueve y veinte y están veintiún grados.';
            ws.send('X-RequestId:' + id + '\r\nContent-Type:application/ssml+xml\r\nX-Timestamp:' + ts() + 'Z\r\nPath:ssml\r\n\r\n'
              + `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xml:lang='es-AR'><voice name='Microsoft Server Speech Text to Speech Voice (es-AR, ElenaNeural)'><prosody pitch='+0Hz' rate='+0%' volume='+0%'>${texto}</prosody></voice></speak>`);
          });
          ws.on('message', (d, bin) => {
            if (!bin) { const s = d.toString(); if (s.includes('Path:audio.metadata')) palabras++; if (s.includes('Path:turn.end')) ws.close(); return; }
            const n = (d[0] << 8) | d[1];
            trozos.push(d.subarray(2 + n));
          });
          ws.on('close', () => {
            const b = Buffer.concat(trozos);
            fs.writeFileSync('elena-a-mano.mp3', b);
            console.log('RESULTADO: audio=' + b.length + ' bytes, marcas de palabra=' + palabras);
            process.exit(b.length > 5000 ? 0 : 1);
          });
          ws.on('error', e => { console.log('RESULTADO: falló → ' + e.message); process.exit(1); });
          setTimeout(() => { console.log('RESULTADO: no contestó a tiempo'); process.exit(1); }, 25000);
          EOF
          sed -i 's/^          //' elena.mjs
          npm install --silent ws
          node elena.mjs
          ls -la elena-a-mano.mp3

  voces:
    # Daniela (Piper) no convence. Acá se arman muestras de todas las opciones reales para que
    # Pedro elija con el oído, que es la única forma seria de decidir esto.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Preparar
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng python3-pip
          pip install --quiet --break-system-packages edge-tts kokoro soundfile || pip install --quiet edge-tts kokoro soundfile
          mkdir -p out

      - name: 1) Elena, la de siempre, pero sin Edge
        continue-on-error: true
        run: |
          F="Buen día, Pedro. Son las nueve y veinte, están veintiún grados y hay sol. Hoy tenés que tomar la pastilla a las once y media. Este mes te quedan doscientos setenta y nueve mil pesos."
          edge-tts --voice es-AR-ElenaNeural --text "$F" --write-media out/1-elena.mp3
          edge-tts --voice es-AR-TomasNeural --text "$F" --write-media out/2-tomas.mp3
          ls -la out/

      - name: 2) Kokoro, la mejor de las que corren en tu compu
        continue-on-error: true
        run: |
          cat > koko.py <<'EOF'
          import soundfile as sf, numpy as np
          from kokoro import KPipeline
          F = "Buen día, Pedro. Son las nueve y veinte, están veintiún grados y hay sol. Hoy tenés que tomar la pastilla a las once y media. Este mes te quedan doscientos setenta y nueve mil pesos."
          p = KPipeline(lang_code='e')
          for v, n in [('ef_dora','3-kokoro-dora'), ('em_alex','4-kokoro-alex')]:
              a = np.concatenate([x.audio.numpy() for x in p(F, voice=v)])
              sf.write(f'out/{n}.wav', a, 24000)
              print('ok', n, len(a)/24000, 'seg')
          EOF
          sed -i 's/^          //' koko.py
          python3 koko.py
          ls -la out/

      - name: 3) Otras voces de Piper, por las dudas
        continue-on-error: true
        run: |
          curl -sSL -o piper.tar.gz https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
          tar xf piper.tar.gz
          F="Buen día, Pedro. Son las nueve y veinte, están veintiún grados y hay sol. Hoy tenés que tomar la pastilla a las once y media. Este mes te quedan doscientos setenta y nueve mil pesos."
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/es
          probar() {
            curl -sSL -o m.onnx "$2" && curl -sSL -o m.onnx.json "$2.json" || return 0
            echo "$F" | ./piper/piper --model m.onnx --output_file "out/$1.wav" || true
          }
          probar 5-piper-sharvard "$base/es_ES/sharvard/medium/es_ES-sharvard-medium.onnx"
          probar 6-piper-davefx   "$base/es_ES/davefx/medium/es_ES-davefx-medium.onnx"
          probar 7-piper-claude   "$base/es_MX/claude/high/es_MX-claude-high.onnx"
          ls -la out/

      - name: Pasarlas todas a mp3 y dejarlas en la rama «muestras»
        run: |
          cd out
          for f in *.wav; do [ -e "$f" ] && ffmpeg -v error -i "$f" -c:a libmp3lame -q:a 3 "${f%.wav}.mp3" && rm "$f"; done
          ls -la
          git init -q && git checkout -q -b muestras
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Muestras de voces en español"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" muestras

  voz:
    # ¿Cómo va a hablar FRIDAY en su propia ventana? WebKitGTK no trae voces del sistema, así que
    # habla Daniela (Piper), que ya está integrada. Acá se arma una muestra para escucharla.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Bajar Piper y la voz Daniela (lo mismo que baja FRIDAY)
        run: |
          curl -sSL -o piper.tar.gz https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
          tar xf piper.tar.gz
          curl -sSL -o daniela.onnx      https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_AR/daniela/high/es_AR-daniela-high.onnx
          curl -sSL -o daniela.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_AR/daniela/high/es_AR-daniela-high.onnx.json
          ls -la piper/piper daniela.onnx

      - name: Hacerla hablar
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          decir() { echo "$2" | ./piper/piper --model daniela.onnx --output_file "$1"; }
          decir 1-saludo.wav "Buen día, Pedro. Son las nueve y veinte, están veintiún grados y hay sol. Hoy tenés que tomar la pastilla a las once y media, y llamar a Marta a la tarde."
          decir 2-plata.wav  "Este mes entraron trescientos diez mil pesos y gastaste treinta mil novecientos. Te quedan doscientos setenta y nueve mil cien. El dieciocho pagás la luz."
          decir 3-corta.wav  "Sí. Dale, lo anoto. Listo, ya está. ¿Querés que te lo recuerde mañana?"
          decir 4-tareas.wav "A Sofi le toca juntar la caca del perro, y vos llevás tres días seguidos cumpliendo. Mamá va ganando por cinco puntos."
          for f in *.wav; do ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f" | xargs printf '%s  %s segundos\n' "$f"; done
          ffmpeg -v error -i 1-saludo.wav -i 2-plata.wav -i 3-corta.wav -i 4-tareas.wav \
            -filter_complex "[0][1][2][3]concat=n=4:v=0:a=1[a]" -map "[a]" -c:a libmp3lame -q:a 2 daniela-muestra.mp3
          ls -la daniela-muestra.mp3

      - uses: actions/upload-artifact@v4
        with:
          name: voz-daniela
          path: daniela-muestra.mp3

      - name: Dejarla en la rama «muestras» (los artefactos no se pueden bajar desde acá)
        run: |
          mkdir -p envio && cp daniela-muestra.mp3 envio/
          cd envio
          git init -q && git checkout -q -b muestras
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Muestra de la voz de Daniela"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" muestras
