name: La ventana propia de FRIDAY
# Compila la ventana propia (WebKitGTK) y la prueba en un escritorio de mentira: que lleve nuestra
# identidad (es lo que mira la barra de tareas), que le entre el micrófono desde el código, y que
# obedezca cuando FRIDAY le dice que se minimice o se muestre.
# El programa compilado queda en la rama «muestras» para poder bajarlo y probarlo en serio.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ventana/**', '.github/workflows/ventana.yml']
permissions:
  contents: write
jobs:
  construir:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }

      - name: Instalar el motor web del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config \
            xvfb x11-utils xdotool socat openbox pulseaudio \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav
          pkg-config --modversion webkit2gtk-4.1

      - name: Compilar
        working-directory: ventana
        run: |
          CGO_ENABLED=1 go build -trimpath -ldflags="-s -w" -o friday-ventana .
          ls -la friday-ventana

      - name: Probarla en un escritorio de mentira
        working-directory: ventana
        run: |
          set -x
          # una página de mentira que hace de FRIDAY: pide el micrófono y cuenta qué pudo hacer
          cat > prueba.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>FRIDAY</title>
          <body style="background:#0b1020;color:#e8eefc;font:16px system-ui"><h1 id=t>…</h1>
          <script>(async()=>{const r={};
            const q=(k,f)=>{try{r[k]=f()}catch(e){r[k]='ERROR '+e}};
            q('audioWorklet',()=>'audioWorklet' in AudioContext.prototype);
            q('MediaSource',()=>!!window.MediaSource);
            q('opus',()=>MediaSource.isTypeSupported('audio/webm; codecs="opus"'));
            q('guardado',()=>{localStorage.setItem('x','1');return localStorage.getItem('x')==='1'});
            try{const s=await navigator.mediaDevices.getUserMedia({audio:true});
                r.microfono='abrió '+s.getAudioTracks().length+' pista(s)';
                s.getTracks().forEach(t=>t.stop());}catch(e){r.microfono='no: '+e.name}
            document.getElementById('t').textContent=JSON.stringify(r);
            await fetch('/listo?r='+encodeURIComponent(JSON.stringify(r)));
          })()</script>
          HTML
          python3 -m http.server 8799 --bind 127.0.0.1 >servidor.txt 2>&1 &
          sleep 1
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          sleep 2
          export DISPLAY=:99
          # sin un gestor de ventanas, minimizar no existe (no hay quién lo haga)
          openbox >/dev/null 2>&1 &
          sleep 2
          # un micrófono de mentira: el servidor de GitHub no tiene ninguno
          pulseaudio --start --exit-idle-time=-1 >/dev/null 2>&1 || true
          pactl load-module module-null-sink sink_name=mudo >/dev/null 2>&1 || true
          pactl load-module module-virtual-source source_name=micro master=mudo.monitor >/dev/null 2>&1 || true
          pactl list short sources || true
          # en un servidor sin placa de video, WebKit se cae si intenta componer con la GPU
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          export LIBGL_ALWAYS_SOFTWARE=1
          ./friday-ventana --url http://127.0.0.1:8799/prueba.html --socket /tmp/fv.sock > salida.txt 2>&1 &
          APP=$!
          sleep 15

          echo "=== 1. La identidad de la ventana (esto es lo que mira la barra de tareas) ==="
          CLASE=$(xdotool search --name FRIDAY 2>/dev/null | while read -r id; do xprop -id "$id" WM_CLASS 2>/dev/null; done | head -1)
          echo "clase: $CLASE"
          echo "$CLASE" | grep -qi 'FRIDAY' || { echo "FALLA: la ventana no se presenta como FRIDAY"; cat salida.txt; kill $APP; exit 1; }

          echo "=== 2. Que obedezca a FRIDAY ==="
          hablar(){ printf '%s\n' "$1" | socat - UNIX-CONNECT:/tmp/fv.sock; }
          hablar ping | grep -q friday-ventana || { echo "FALLA: no contesta el socket"; kill $APP; exit 1; }
          hablar minimizar; sleep 2
          hablar estado | tee est1.txt | grep -q '"minimizada":true' || { echo "FALLA: no se minimizó"; cat est1.txt; kill $APP; exit 1; }
          hablar mostrar; sleep 2
          hablar estado | tee est2.txt | grep -q '"minimizada":false' || { echo "FALLA: no volvió"; cat est2.txt; kill $APP; exit 1; }

          echo "=== 3. Lo que pudo hacer la página (micrófono, música, guardado) ==="
          python3 - <<'PY' > capacidades.txt
          import re, urllib.parse
          t = open('servidor.txt', encoding='utf-8', errors='replace').read()
          m = re.search(r'listo\?r=(\S+)', t)
          print(urllib.parse.unquote(m.group(1)) if m else 'NADA')
          PY
          cat capacidades.txt
          grep -q '"audioWorklet": *true' capacidades.txt || { echo "FALLA: sin AudioWorklet no puede escuchar"; kill $APP; exit 1; }
          # Lo nuestro es el PERMISO: que la ventana se lo dé sola, sin tocar archivos de nadie. Si
          # la máquina no tiene micrófono (los servidores de GitHub no tienen), eso no es culpa
          # nuestra; lo que no puede pasar nunca es que lo rebote por falta de permiso.
          grep -qE 'NotAllowedError|SecurityError|PermissionDenied' capacidades.txt && { echo "FALLA: no le dio el permiso del micrófono"; kill $APP; exit 1; }
          grep -q 'abrió 1 pista' capacidades.txt && echo "y además le entró audio de verdad" || echo "(esta máquina no tiene micrófono; el permiso sí se lo dio)"

          echo "=== 4. Que se vaya cuando le decimos ==="
          hablar chau
          for i in $(seq 1 20); do kill -0 $APP 2>/dev/null || break; sleep 1; done
          kill -0 $APP 2>/dev/null && { echo "FALLA: no se cerró"; kill $APP; exit 1; }
          echo TODO OK
          cat salida.txt

      - name: Dejar el programa a mano para bajarlo
        if: success()
        run: |
          git config --global user.name  'FRIDAY'
          git config --global user.email 'friday@bufalabs.invalid'
          mkdir -p /tmp/m && cp ventana/friday-ventana /tmp/m/
          cd /tmp/m
          sha256sum friday-ventana > friday-ventana.sha256
          git init -q && git checkout -q -b muestras
          git add -A && git commit -q -m "friday-ventana compilada ($GITHUB_SHA)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" muestras

      - name: Que queden las pruebas a mano
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ventana
          path: |
            ventana/salida.txt
            ventana/capacidades.txt
            ventana/friday-ventana
          if-no-files-found: ignore
