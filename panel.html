<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FRIDAY Casa</title>
<link rel="manifest" href="manifest-panel.json">
<meta name="theme-color" content="#F6E9DA">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   FRIDAY Casa · la pantalla de la casa
   La luz de la pantalla sigue al sol de tu ciudad (mañana durazno, mediodía claro,
   atardecer rosado, noche tenue). Letra grande para leer de lejos. Todo por voz.
   ===================================================================== */
:root{
  --wall-a:#FBEBDD; --wall-b:#F5EFE8;            /* lo cambia el sol */
  --ink:#2B241D; --ink-2:#76685A; --ink-3:#A8998A;
  --card:#FFFCF8; --card-2:#F8F0E7; --edge:rgba(116,84,52,.10);
  --shadow:0 1px 0 rgba(255,255,255,.75) inset, 0 18px 40px -26px rgba(96,62,28,.45), 0 2px 6px -3px rgba(96,62,28,.12);
  --friday:#2F6BE3; --friday-2:#6BA2F6; --friday-soft:#E3ECFC;
  --lamp:#F0A332; --lamp-soft:#FFF0D6; --leaf:#4E8A57; --alert:#D2475C;
  --disp:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --text:"Atkinson Hyperlegible", system-ui, "Segoe UI", Roboto, sans-serif;
  --r-big:34px; --r-mid:22px; --r-small:14px;
  color-scheme:light;
}
body.night{
  --wall-a:#2A221C; --wall-b:#171310;
  --ink:#F2E7D9; --ink-2:#BFAE9A; --ink-3:#8C7B69;
  --card:#2F2721; --card-2:#3A3029; --edge:rgba(255,220,180,.07);
  --shadow:0 1px 0 rgba(255,235,210,.05) inset, 0 20px 40px -24px rgba(0,0,0,.7);
  --friday-soft:#24314C; --lamp-soft:#4A3418;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font:400 19px/1.35 var(--text);color:var(--ink);background:var(--wall-b);-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#wall{position:fixed;inset:0;background:radial-gradient(120% 90% at 18% 0%, var(--wall-a) 0%, var(--wall-b) 62%);transition:background 4s linear}
#wall::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(60% 50% at 100% 100%, rgba(255,255,255,.35), transparent 70%)}
body.night #wall::after{opacity:0}
button{font:inherit;color:inherit}
.app{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:28px 34px 28px;gap:10px;max-width:1600px;margin:0 auto}

/* ---------- arriba: saludo y hora ---------- */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
.greet h1{margin:0;font:600 38px/1.05 var(--disp);font-variation-settings:"opsz" 72;letter-spacing:-.01em}
.greet p{margin:6px 0 0;color:var(--ink-2);font-size:19px}
.now{display:flex;align-items:center;gap:22px;text-align:right}
.clock{font:300 74px/0.9 var(--disp);font-variation-settings:"opsz" 96,"wdth" 85;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wxnow{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:8px;color:var(--ink-2);font-size:18px}
.wxnow svg{width:30px;height:30px}
.wxnow b{color:var(--ink);font:500 24px/1 var(--disp)}
.timers{display:flex;flex-direction:column;gap:8px}
.tpill{display:flex;align-items:center;gap:12px;padding:8px 18px 8px 10px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--edge)}
.tpill svg{width:46px;height:46px;transform:rotate(-90deg)}
.tpill circle{fill:none;stroke-width:5}.tpill .bg{stroke:var(--card-2)}.tpill .fg{stroke:var(--friday);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.tpill b{font:500 30px/1 var(--disp);font-variant-numeric:tabular-nums;min-width:96px;text-align:left}
.tpill span{color:var(--ink-2);font-size:17px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpill.urge .fg{stroke:var(--alert)}.tpill.urge b{color:var(--alert)}
.tpill.ring{animation:ring .6s ease-in-out infinite alternate}
@keyframes ring{to{transform:scale(1.05)}}

/* ---------- el centro: FRIDAY y lo que se dicen ---------- */
.stage{display:grid;grid-template-columns:minmax(220px,300px) 1fr;align-items:center;gap:42px;min-height:0;padding:0 8px}
.friday{display:flex;flex-direction:column;align-items:center;gap:16px}
#face{width:min(250px,26vh);aspect-ratio:1;position:relative;cursor:pointer}
#face svg,.fface svg{width:100%;height:100%;overflow:visible;display:block}
.status{display:inline-flex;align-items:center;gap:10px;padding:9px 18px;border-radius:999px;background:var(--card);border:1px solid var(--edge);box-shadow:var(--shadow);color:var(--ink-2);font-size:17px;white-space:nowrap}
.status i{width:10px;height:10px;border-radius:50%;background:var(--leaf);flex:0 0 10px}
.status.listen{color:var(--friday)}.status.listen i{background:var(--friday);animation:pulse 1s ease-in-out infinite}
.status.think i{background:var(--lamp);animation:pulse .7s ease-in-out infinite}
.status.warn{color:var(--alert)}.status.warn i{background:var(--alert)}
.status.off i{background:var(--ink-3)}
@keyframes pulse{50%{transform:scale(.55);opacity:.55}}
.talk{min-width:0;max-width:820px}
.her{margin:0;font:500 clamp(30px,3.6vw,46px)/1.16 var(--disp);font-variation-settings:"opsz" 60;letter-spacing:-.01em;text-wrap:pretty;
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.her .said{color:var(--ink)}.her .tosay{color:var(--ink-3)}
.you{margin:16px 0 0;color:var(--ink-2);font-size:21px;min-height:28px}
.you q{quotes:"«" "»"}
.you .bars{display:inline-flex;gap:4px;align-items:center;height:22px;margin-left:10px;vertical-align:middle}
.you .bars i{width:5px;height:6px;border-radius:3px;background:var(--friday);transition:height .08s}
.hint{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px}
.hint span{padding:8px 15px;border-radius:999px;border:1px dashed color-mix(in srgb,var(--ink-3) 60%,transparent);color:var(--ink-2);font-size:16px}

/* ---------- abajo: el estante de tarjetas ---------- */
.shelf{display:grid;grid-template-columns:1.3fr 1.3fr 1fr .95fr;gap:18px;align-items:stretch;height:min(318px,38vh)}
.card{position:relative;background:var(--card);border:1px solid var(--edge);border-radius:var(--r-big);box-shadow:var(--shadow);padding:20px 22px;min-width:0;overflow:hidden;display:flex;flex-direction:column;
  transition:transform .4s cubic-bezier(.2,.8,.3,1.2), box-shadow .4s}
.card[hidden]{display:none}
.card.hot{transform:translateY(-6px);box-shadow:0 0 0 3px color-mix(in srgb,var(--friday) 55%,transparent), var(--shadow)}
.card h2{margin:0 0 12px;font:600 23px/1.1 var(--disp);font-variation-settings:"opsz" 30;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card h2 small{font:400 16px var(--text);color:var(--ink-2)}
.card .empty{color:var(--ink-2);font-size:17px;line-height:1.4;margin-top:auto;margin-bottom:auto}
.card .empty q{color:var(--ink);quotes:"«" "»"}
.list{display:flex;flex-direction:column;gap:2px;overflow:hidden}
.row{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:7px 0;border-top:1px solid var(--edge)}
.row:first-child{border-top:0}
.row time,.row .k{font:500 19px/1.2 var(--disp);font-variant-numeric:tabular-nums;color:var(--friday)}
.row .k svg{width:20px;height:20px;vertical-align:-3px;color:var(--ink-2)}
.row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row span small{display:block;color:var(--ink-2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{color:var(--ink-2);font-size:15px}
.row .tag{font-size:14px;padding:2px 10px;border-radius:999px;background:var(--friday-soft);color:var(--friday)}
.row.note span{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row.aviso .k{color:var(--alert)}
/* casa */
.devs{display:grid;grid-template-columns:1fr 1fr;gap:10px;overflow:hidden}
.dev{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:6px;padding:12px 14px 11px;min-height:92px;border-radius:var(--r-mid);border:1px solid var(--edge);background:var(--card-2);cursor:pointer;text-align:left;min-width:0;
  transition:background .35s, border-color .35s, transform .15s}
.dev:active{transform:scale(.97)}
.dev svg{width:28px;height:28px;flex:0 0 28px;color:var(--ink-3);transition:color .35s}
.dev span{font-size:16px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;width:100%}
.dev small{display:block;color:var(--ink-2);font-size:13px;margin-top:2px}
.dev.on{background:var(--lamp-soft);border-color:color-mix(in srgb,var(--lamp) 45%,transparent)}
.dev.on svg{color:var(--lamp);filter:drop-shadow(0 0 8px color-mix(in srgb,var(--lamp) 70%,transparent))}
.dev.off{opacity:.5}.dev.busy{animation:busy .9s ease-in-out infinite}
@keyframes busy{50%{opacity:.55}}
/* música */
.music{display:flex;flex-direction:column;gap:12px;min-height:0;flex:1}
.cover{flex:1;min-height:0;border-radius:var(--r-mid);background:radial-gradient(90% 90% at 25% 15%, var(--friday-2), var(--friday) 70%) center/cover;position:relative;overflow:hidden}
.cover.noimg::before{content:"♪";position:absolute;right:18px;top:6px;font:600 84px/1 var(--disp);color:rgba(255,255,255,.35)}
.cover::after{content:"";position:absolute;inset:auto 0 0 0;height:55%;z-index:1;background:linear-gradient(transparent,rgba(30,18,8,.72))}
.cover .meta{position:absolute;left:16px;right:16px;bottom:12px;z-index:2;color:#fff}
.cover .meta b{display:block;font:600 21px/1.15 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover .meta small{font-size:15px;opacity:.85}
.cover .src{position:absolute;top:12px;left:12px;z-index:2;font-size:13px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.88);color:#2b241d}
.prog{height:5px;border-radius:3px;background:var(--card-2);overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--friday);transition:width 1s linear}
/* compras */
.shop{display:flex;flex-direction:column;gap:0;overflow:hidden}
.shop button{display:flex;align-items:center;gap:12px;padding:8px 0;border:0;border-top:1px solid var(--edge);background:none;text-align:left;cursor:pointer;font-size:18px}
.shop button:first-child{border-top:0}
.shop button i{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink-3);flex:0 0 24px;transition:background .25s,border-color .25s}
.shop button.ok{color:var(--ink-3);text-decoration:line-through}.shop button.ok i{background:var(--leaf);border-color:var(--leaf);box-shadow:inset 0 0 0 4px var(--card)}
.shop .more{color:var(--ink-2);font-size:15px;padding-top:6px}

/* ---------- aviso grande ---------- */
.banner{visibility:hidden;position:fixed;left:50%;top:22px;z-index:30;display:flex;align-items:center;gap:18px;padding:16px 28px 16px 18px;border-radius:28px;background:var(--card);box-shadow:0 30px 60px -20px rgba(80,50,20,.45);border:1px solid var(--edge);
  transform:translate(-50%,-160%);transition:transform .6s cubic-bezier(.2,.9,.25,1.15);max-width:min(860px,92vw)}
.banner.on{transform:translate(-50%,0);visibility:visible}
.banner .ic{width:58px;height:58px;border-radius:18px;background:var(--lamp-soft);display:grid;place-items:center;font-size:30px;flex:0 0 58px}
.banner b{display:block;font:600 26px/1.15 var(--disp)}
.banner small{color:var(--ink-2);font-size:18px}

/* ---------- modo ambiente: el cielo de tu ciudad ---------- */
.ambient{position:fixed;inset:0;z-index:40;background:#0b1424;opacity:0;pointer-events:none;transition:opacity 1.6s}
.ambient.on{opacity:1;pointer-events:auto}
.ambient canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ambient .over{position:absolute;left:5vw;top:7vh;color:#fff;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.ambient .aclock{font:300 clamp(90px,15vw,190px)/.9 var(--disp);font-variation-settings:"opsz" 96,"wdth" 80;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ambient .adate{font:400 26px var(--text);opacity:.92;margin-top:10px}
.ambient .awx{display:flex;align-items:center;gap:12px;margin-top:16px;font:500 30px var(--disp)}
.ambient .awx svg{width:44px;height:44px}
.ambient .anext{position:absolute;right:5vw;top:8vh;max-width:36vw;text-align:right;color:#fff;font-size:22px;line-height:1.4;text-shadow:0 2px 18px rgba(0,0,0,.4)}
.ambient .anext b{display:block;font:600 30px/1.15 var(--disp)}
.ambient .cap{position:absolute;left:5vw;right:5vw;bottom:3.4vh;display:flex;gap:26px;flex-wrap:wrap;color:rgba(255,255,255,.88);font-size:17px;text-shadow:0 1px 8px rgba(0,0,0,.6)}

/* ---------- primera vez: escaneá con el celu ---------- */
.setup{position:fixed;inset:0;z-index:50;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:6vw;padding:6vh 7vw;background:radial-gradient(120% 100% at 10% 0%,#FCE9D6,#F4EEE6 70%)}
.setup[hidden]{display:none}
.setup .sface{width:min(260px,30vh);margin-bottom:22px}
.setup h1{margin:0 0 14px;font:600 54px/1.02 var(--disp);letter-spacing:-.02em;color:#2B241D}
.setup p{margin:0 0 12px;font-size:22px;line-height:1.45;color:#5C4F42;max-width:30ch}
.setup .qrbox{justify-self:center;background:#fff;border-radius:36px;padding:30px 30px 22px;box-shadow:0 30px 70px -30px rgba(90,60,30,.5);text-align:center}
.setup .qrbox svg,.setup .qrbox img{width:min(330px,42vh);height:auto;display:block;margin:0 auto}
.setup .code{font:600 40px/1 var(--disp);letter-spacing:.12em;margin-top:18px;color:#2B241D}
.setup .code small{display:block;font:400 16px var(--text);letter-spacing:0;color:#76685A;margin-top:8px}
.setup .st{margin-top:18px;color:var(--friday);font-size:20px;min-height:28px}
.setup .sclose{margin-top:14px;font:600 18px var(--text);padding:12px 28px;border-radius:999px;border:0;background:#2B241D;color:#fff}.setup .sclose[hidden]{display:none}

/* ---------- toque inicial (el navegador pide un toque para el micrófono y la voz) ---------- */
.tap{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;border:0;width:100%;
  background:color-mix(in srgb,var(--wall-b) 82%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer}
.tap[hidden]{display:none}
.tap b{font:600 40px/1.1 var(--disp)}
.tap span{color:var(--ink-2);font-size:20px}

.toast{visibility:hidden;position:fixed;left:50%;bottom:26px;transform:translate(-50%,calc(100% + 40px));padding:12px 22px;border-radius:999px;background:var(--ink);color:var(--wall-b);font-size:17px;z-index:60;transition:transform .4s;max-width:90vw}
.toast.on{transform:translate(-50%,0);visibility:visible}
#ytbox{position:absolute;inset:0;z-index:0;display:none;pointer-events:none}#ytbox.on{display:block}#ytbox iframe{width:100%;height:100%;border:0;transform:scale(1.25)}

/* ---------- la cara ---------- */
#face .head{transform-origin:100px 110px;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
#face .breathe{animation:breathe 5s ease-in-out infinite;transform-origin:100px 190px}
@keyframes breathe{50%{transform:scale(1.018,.985)}}
#face .eyes{transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
#face .eye{transition:d .18s ease, transform .12s;transform-box:fill-box;transform-origin:center}
#face .eye.blink{transform:scaleY(.08)}
#face .brow,#face .mouth{transition:d .22s ease, opacity .2s}
#face .cheek{transition:opacity .4s}
#face .extra{transition:opacity .35s}
body.night #face .skin-a{stop-color:#4C7FD9}body.night #face .skin-b{stop-color:#2550A8}

/* vertical (tablet parada) */
@media (orientation:portrait){
  .app{grid-template-rows:auto auto 1fr;padding:26px 26px 24px}
  .stage{grid-template-columns:1fr;justify-items:center;text-align:center;gap:20px;padding-top:2vh}
  .hint{justify-content:center}
  .shelf{grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);height:auto;min-height:0}
  .clock{font-size:58px} .wxnow span{display:none}
  .setup{grid-template-columns:1fr;text-align:center;justify-items:center;gap:3vh}
}
@media (max-height:620px) and (orientation:landscape){ .shelf{height:44vh} #face{width:22vh} .greet h1{font-size:30px} .clock{font-size:58px} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
body.lite .card{box-shadow:0 1px 0 var(--edge)} body.lite .tap{backdrop-filter:none;-webkit-backdrop-filter:none}
</style>
</head>
<body>
<div id="wall"></div>
<div class="app" id="app">
  <header class="top">
    <div class="greet"><h1 id="hello">Hola</h1><p id="today"></p></div>
    <div class="now">
      <div class="timers" id="timers"></div>
      <div><div class="clock" id="clock">--:--</div><div class="wxnow" id="wxNow"></div></div>
    </div>
  </header>
  <main class="stage">
    <div class="friday"><div id="face" class="fface" aria-label="FRIDAY"></div><div class="status" id="status"><i></i><span>Decí «Friday»</span></div></div>
    <div class="talk" aria-live="polite">
      <p class="her" id="her"></p>
      <p class="you" id="you"></p>
      <div class="hint" id="hint"></div>
    </div>
  </main>
  <section class="shelf" id="shelf">
    <article class="card" id="cHoy" data-k="hoy"></article>
    <article class="card" id="cCasa" data-k="casa"></article>
    <article class="card" id="cMus" data-k="mus"><h2>Música<small id="mSt"></small></h2>
      <p class="empty" id="mEmpty">Pedime algo: <q>Friday, poné Soda Stereo</q>.</p>
      <div class="music" id="mBox" hidden><div class="cover" id="mCover"><div id="ytbox"><div id="ytp"></div></div><span class="src" id="mSrc"></span><div class="meta"><b id="mTitle"></b><small id="mArtist"></small></div></div><div class="prog"><i id="mProg"></i></div></div></article>
    <article class="card" id="cShop" data-k="shop"></article>
  </section>
</div>
<div class="banner" id="banner"><div class="ic" id="bnIc"></div><div><b id="bnT"></b><small id="bnS"></small></div></div>
<div class="ambient" id="ambient"><canvas id="skycv"></canvas>
  <div class="over"><div class="aclock" id="aClock"></div><div class="adate" id="aDate"></div><div class="awx" id="aWx"></div></div>
  <div class="anext" id="aNext"></div><div class="cap" id="skyCap"></div></div>
<div class="setup" id="setup" hidden>
  <div><div class="sface fface" id="sFace"></div><h1>Hola, soy FRIDAY.</h1>
    <p>Voy a ser la pantalla de tu casa: me hablás y hago.</p>
    <p>Para configurarme, escaneá este código con la cámara de tu celu. No hay que escribir nada acá.</p></div>
  <div class="qrbox"><div id="qr"></div><div class="code" id="sCode"></div><div class="st" id="sSt">Esperando al celu…</div><button class="sclose" id="sClose" type="button" hidden>Listo</button></div>
</div>
<button class="tap" id="tap" hidden><b>Tocá para empezar</b><span>Una sola vez. Después, decí «Friday» y lo que necesites.</span></button>
<div class="toast" id="toast"></div>
<script>
'use strict';
// ================================================================ QR propio (para no depender de nada de afuera)
// Codifica texto (modo byte, corrección M, versiones 1 a 10) y devuelve un SVG.
const QR=(()=>{
  const T=[null,[10,[[1,16]]],[16,[[1,28]]],[26,[[1,44]]],[18,[[2,32]]],[24,[[2,43]]],[16,[[4,27]]],[18,[[4,31]]],[22,[[2,38],[2,39]]],[22,[[3,36],[2,37]]],[26,[[4,43],[1,44]]]];
  const AL=[null,[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50]];

function whisperPrompt(){
  const nombres=new Set();
  try{ for(const m of (memory||[]).slice(-40)) (String(m).match(/\b[A-ZÁÉÍÓÚÑ][a-záéíóúñ]{2,}\b/g)||[]).forEach(w=>{ if(nombres.size<12) nombres.add(w); }); }catch(e){}
  try{ for(const d of ((casa.devs)||[]).slice(0,10)) nombres.add(d.nombre); }catch(e){}
  const last=(Ear.hooks && Ear.hooks.lastSaid && Ear.hooks.lastSaid()) || '';
  const base=`Charla en español rioplatense con FRIDAY, una asistente de voz de la casa. ${S.name?'El usuario se llama '+S.name+'.':''} Suele empezar diciendo el nombre FRIDAY. Escribí siempre "Friday". Palabras frecuentes: Friday, ${S.city||''}, Spotify, YouTube, poné, prendé, apagá, la luz, timer, recordame, la lista, agregá${nombres.size?', '+[...nombres].join(', '):''}.`;
  return (last ? base+` FRIDAY recién dijo: "${String(last).slice(-200)}"` : base).slice(0,900);
}
async function sttSend(frames){
  const h=Ear.hooks;
  const fd=new FormData();
  fd.append('file', encodeWav(frames, stt.sr), 'voz.wav');
  const wm=whisperModel();
  fd.append('model', wm); fd.append('language','es'); fd.append('response_format','verbose_json'); fd.append('temperature','0');
  fd.append('prompt', whisperPrompt());
  h.onSending();
  try{
    (wm==='whisper-large-v3-turbo'?Ear.calls:Ear.sendCalls).push(Date.now());
    const r=await fetch(API.groq+'/audio/transcriptions',{method:'POST', headers:{Authorization:'Bearer '+S.groqKey}, body:fd});
    if(r.status===429){ const tx=await r.clone().text().catch(()=>''); sttCool(wm, retryMs(tx, r)); }
    if(!r.ok){ if((r.status===429 || r.status>=500) && wm!=='whisper-large-v3-turbo') stt.turboUntil=Date.now()+10*60000; throw new Error('whisper '+r.status); }
    const d=await r.json(); let txt=(d.text||'').trim();
    const segs=Array.isArray(d.segments)?d.segments:[];
    if(segs.length && txt){
      const noVoz=segs.every(x=>(x.no_speech_prob||0)>0.55);
      const dudoso=segs.reduce((a,x)=>a+(x.avg_logprob||0),0)/segs.length < -1.1 && txt.split(/\s+/).length<4;
      if(noVoz || dudoso) txt='';
    }
    stt.fails=0;
    if(!txt || WHISPER_JUNK.test(norm(txt))){ h.onDrop(); return; }
    earHeard(txt);
  }catch(e){ stt.fails++; console.warn(e); h.onDrop(true); }
}
// lo que llegó de Whisper: ¿era para ella?
function earHeard(text){
  const h=Ear.hooks;
  if(S.wake && Date.now()>Ear.convoUntil){
    const w=stripWake(text);
    if(!w.called){ h.onNotForMe(text); return; }
    Ear.convoUntil=Date.now()+12000;
    if(!w.rest || w.rest.length<2){ h.onJustName(); return; }
    h.onText(w.restOrig||text, text); return;
  }
  h.onText(text, text);
}
async function earStart(){
  if(stt.on) return true;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true, channelCount:1}});
    const ac=new (window.AudioContext||window.webkitAudioContext)(); Ear.ac=ac;
    const src=ac.createMediaStreamSource(stream);
    const mute=ac.createGain(); mute.gain.value=0; mute.connect(ac.destination);
    stt.sr=ac.sampleRate;
    const onChunk=d=>{ let s2=0; for(let i=0;i<d.length;i+=4) s2+=d[i]*d[i]; const lv=Math.sqrt(s2/(d.length/4)); stt.level = lv>stt.level ? lv : stt.level*0.6+lv*0.4; sttFrame(d); };
    if(ac.audioWorklet && window.AudioWorkletNode){
      try{
        const code="class FridayMic extends AudioWorkletProcessor{constructor(){super();this.b=new Float32Array(4096);this.n=0;}process(inp){const c=inp[0]&&inp[0][0];if(c){let i=0;while(i<c.length){const k=Math.min(c.length-i,4096-this.n);this.b.set(c.subarray(i,i+k),this.n);this.n+=k;i+=k;if(this.n===4096){this.port.postMessage(this.b,[this.b.buffer]);this.b=new Float32Array(4096);this.n=0;}}}return true;}}registerProcessor('friday-mic',FridayMic);";
        await ac.audioWorklet.addModule(URL.createObjectURL(new Blob([code],{type:'application/javascript'})));
        const node=new AudioWorkletNode(ac,'friday-mic',{numberOfInputs:1, numberOfOutputs:1, outputChannelCount:[1]});
        node.port.onmessage=e=>onChunk(e.data); src.connect(node); node.connect(mute); stt.worklet=true;
      }catch(e){ stt.worklet=false; }
    }
    if(!stt.worklet){ const proc=ac.createScriptProcessor(4096,1,1); src.connect(proc); proc.connect(mute); proc.onaudioprocess=e=>onChunk(e.inputBuffer.getChannelData(0)); }
    stt.on=true; return true;
  }catch(e){ console.warn('mic', e); return false; }
}

function applyLight(){

    else if(h<16){ A=noon[0]; B=noon[1]; }
    else { const k=Math.min(1,Math.max(0,(30-el)/22)); A=mix(noon[0],honey[0],k); B=mix(noon[1],honey[1],k); }

function faceSet(name, ms){

}

  if(Date.now()>FACE.until) FACE.cur=FACE.base;

}
function faceApplyTo(root, e){
  if(!root.querySelector('.eyes')) return;
  const q=s=>root.querySelectorAll(s);
  const d=(el,v)=>{ if(el) el.style.d=`path("${v}")`; };
  d(q('.eL')[0], e.eyes[0]); d(q('.eR')[0], e.eyes[1]); d(q('.bL')[0], e.brows[0]); d(q('.bR')[0], e.brows[1]);
  const m=q('.mouth')[0]; let mouth=e.mouth;
  if(FACE.talk>0.05 && !e.fill){ const o=Math.round(4+FACE.talk*16); mouth=`M84 134q16 ${o+6} 32 0q-16 ${Math.round(o*.45)} -32 0z`; }
  d(m, mouth); m.setAttribute('fill', (e.fill || FACE.talk>0.05) ? '#1F3F8F' : 'none');
  q('.cheek').forEach(c=>c.setAttribute('opacity', e.cheek||0));

}
function faceBlink(){
  const root=$('face'); clearTimeout(FACE.blinkT);
  FACE.blinkT=setTimeout(()=>{ if(!document.hidden && !['laugh','happy','love','sleepy','cool'].includes(FACE.cur)){ root.querySelectorAll('.eye').forEach(e=>e.classList.add('blink')); setTimeout(()=>root.querySelectorAll('.eye').forEach(e=>e.classList.remove('blink')), 130); } faceBlink(); }, 2600+Math.random()*3800);

// ---------------------------------------------------------------- la voz (hablar)
const tts={ q:[], on:false, epoch:0, voice:null, lastEnd:0, shown:'', said:'' };
function pickVoice(){
  const vs=speechSynthesis.getVoices(); if(!vs.length) return null;
  if(S.voice){ const v=vs.find(v=>v.name===S.voice); if(v) return v; }
  const es=vs.filter(v=>/^es/i.test(v.lang));
  return es.find(v=>/es-AR/i.test(v.lang)) || es.find(v=>/es-US/i.test(v.lang)&&/google/i.test(v.name)) || es.find(v=>/es-(US|MX|419)/i.test(v.lang)) || es.find(v=>/google/i.test(v.name)) || es[0] || null;
}
try{ speechSynthesis.onvoiceschanged=()=>{ tts.voice=pickVoice(); }; }catch(e){}
function spokenForm(t){
  return String(t).replace(/\[\[[^\]]*\]\]/g,'').replace(/[*_#`>]/g,'').replace(/https?:\/\/\S+/g,'')
    .replace(/(\d+)\s?°/g,'$1 grados').replace(/(\d+)\s?%/g,'$1 por ciento').replace(/\bkm\/h\b/g,'kilómetros por hora')
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,'').replace(/\s+/g,' ').trim();
}
function speakChunk(text){
  const t=spokenForm(text); if(!t) return;
  tts.q.push(t); if(!tts.on) speakNext();
}
function speakNext(){
  const t=tts.q.shift();
  if(!t){ tts.on=false; tts.lastEnd=Date.now(); faceTalk(false); duck(false); setMode(state.mode==='speaking'?'idle':state.mode); stt.muteUntil=performance.now()+700; return; }
  tts.on=true; setMode('speaking'); duck(true); faceTalk(true);
  const u=new SpeechSynthesisUtterance(t), ep=tts.epoch;
  u.lang='es-AR'; if(!tts.voice) tts.voice=pickVoice(); if(tts.voice){ u.voice=tts.voice; u.lang=tts.voice.lang; } u.rate=1.04; u.pitch=1.02;
  const done=()=>{ if(ep!==tts.epoch) return; tts.said+=' '+t; showHer(); speakNext(); };
  u.onend=done; u.onerror=done;
  // si el motor de voz se cuelga (pasa en algunas tablets), sigue igual
  const guard=setTimeout(()=>{ if(ep===tts.epoch && tts.on && tts.q[0]!==t){ try{ speechSynthesis.cancel(); }catch(e){} done(); } }, 2500+t.length*110);
  u.onend=()=>{ clearTimeout(guard); done(); }; u.onerror=()=>{ clearTimeout(guard); done(); };
  try{ speechSynthesis.speak(u); }catch(e){ clearTimeout(guard); done(); }
}
function stopTalk(){ tts.epoch++; tts.q=[]; try{ speechSynthesis.cancel(); }catch(e){} tts.on=false; faceTalk(false); duck(false); tts.lastEnd=Date.now(); }
const speakingNow=()=>tts.on || tts.q.length>0 || Date.now()-tts.lastEnd<600;
// lo que dice se escribe grande; lo ya dicho más oscuro
function showHer(){
  const all=tts.shown, said=tts.said.trim();
  let i=0; const a=norm(all), b=norm(said);
  if(b && a.startsWith(b.slice(0,Math.max(0,b.length-2)))) i=Math.min(all.length, Math.round(all.length*b.length/Math.max(1,a.length)));
  $('her').innerHTML=`<span class="said">${esc(all.slice(0,i))}</span><span class="tosay">${esc(all.slice(i))}</span>`;
  if(!speakingNow()) $('her').innerHTML=`<span class="said">${esc(all)}</span>`;
}
function say(text, emo){
  stopTalk(); tts.shown=spokenForm(text); tts.said=''; showHer();
  if(emo) faceSet(emo, 2600);
  const parts=tts.shown.match(/[^.!?¡¿]+[.!?]*\s*|.+$/g)||[tts.shown];
  for(const p of parts) speakChunk(p);
  pushHist('assistant', text);
}

// ---------------------------------------------------------------- estado en pantalla
function setMode(m){
  const was=state.mode; state.mode=m; renderStatus();
  if(m==='listening' || m==='thinking'){ FACE.cur=m; FACE.until=Date.now()+60000; faceApply(); }
  else if(['listening','thinking'].includes(FACE.cur)){ FACE.until=0; faceApply(); }
  if(m!==was) renderHint();
}
function renderStatus(){
  const el=$('status'); if(!el) return; const now=Date.now(), cool=Math.max(stt.coolUntil||0, stt.coolPeek||0);
  let cls='', txt='Decí «Friday»';
  if(!navigator.onLine){ cls='warn'; txt='Sin internet'; }
  else if(!stt.on && state.started){ cls='warn'; txt='No tengo permiso para el micrófono'; }
  else if(state.mode==='listening'){ cls='listen'; txt='Te escucho…'; }
  else if(state.mode==='thinking'){ cls='think'; txt='Pensando…'; }
  else if(state.mode==='speaking'){ cls='listen'; txt='Hablando'; }
  else if(cool>now){ cls='warn'; txt='Sin cupo de Groq · vuelve '+(cool-now<90000?'en un minuto':'a las '+hhmm(new Date(cool))); }

}

let AC=null;
function audioCtx(){ if(!AC){ try{ AC=Ear.ac || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function chime(kind){
  const ac=audioCtx(); if(!ac) return; const t=ac.currentTime;
  const notes = kind==='alarm' ? [880,660,880,660] : kind==='down' ? [660,440] : kind==='aviso' ? [523,659,784] : [660,880];
  notes.forEach((f,i)=>{ const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(ac.destination);
    const s=t+i*(kind==='alarm'?.22:.13); g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(kind==='alarm'?.35:.18,s+.02); g.gain.exponentialRampToValueAtTime(.001,s+.35); o.start(s); o.stop(s+.4); });
}

// ---------------------------------------------------------------- atajos (al instante, sin pensar)
const NUM_W={un:1,una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,quince:15,veinte:20,veinticinco:25,treinta:30,cuarenta:40,cuarenta_y_cinco:45,cincuenta:50,noventa:90};
function durFrom(nf){
  let n=nf.replace(/cuarenta y cinco/g,'cuarenta_y_cinco'), secs=0, hit=false;
  if(/\b(un )?cuarto de hora\b/.test(n)){ secs+=900; hit=true; }
  if(/\bmedia hora\b/.test(n)){ secs+=1800; hit=true; }
  if(/\bhora y media\b/.test(n)){ secs+=1800; }
  for(const m of n.matchAll(/\b(\d+|[a-z_]+) (horas?|hs|minutos?|mins?|segundos?|segs?)\b/g)){
    const v=/^\d+$/.test(m[1]) ? +m[1] : NUM_W[m[1]]; if(!v) continue;
    secs += /^(h|hs)/.test(m[2]) ? v*3600 : /^m/.test(m[2]) ? v*60 : v; hit=true;
  }
  if(/\b(\d+|[a-z_]+) minutos? y medio\b/.test(n)) secs+=30;
  return hit && secs>0 && secs<=24*3600 ? secs : 0;
}
function durTxt(secs){ const h=Math.floor(secs/3600), m=Math.floor(secs%3600/60), x=secs%60; const p=[]; if(h) p.push(h===1?'una hora':h+' horas'); if(m) p.push(m===1?'un minuto':m+' minutos'); if(x) p.push(x+' segundos'); return p.join(' y ') || '0 segundos'; }
const CASA_COLORES=/\b(rojo|roja|naranja|amarill[oa]|verde|turquesa|celeste|cian|azul|violeta|lila|morado|purpura|rosa|rosado|fucsia|magenta)\b/;
function fast(text, nf){
  const n0=nf.replace(/^(che |dale |bueno |eh )+/,'');
  // callate / pará
  if(/^(callate|silencio|para|pará|basta|ya esta|stop|shh+)( friday)?$/.test(n0)){ stopTalk(); $('her').textContent=''; return true; }
  // hora
  if(/^(que hora es|que hora tenes|me decis la hora|hora)$/.test(n0)){ const d=new Date(); sayFast(text, `Son las ${d.getHours()}${d.getMinutes()?' y '+d.getMinutes():''}.`); return true; }
  // timers
  const isTimer=/\b(timer|temporizador|cuenta regresiva|alarma)\b/.test(nf);
  if(isTimer && /\b(cancela|para|frena|apaga|borra|saca|quita|elimina|detene)\w*( el| los| todos los| ese| la| las)? (timer|temporizador|alarma|cuenta regresiva)s?\b/.test(nf)){
    const n=timers.length; timers=[]; saveTimers(); sayFast(text, n ? (n===1?'Listo, cancelé el timer.':`Listo, cancelé los ${n} timers.`) : 'No hay ningún timer andando.'); return true;
  }
  if(/\b(cuanto (le )?(falta|queda)|cuanto tiempo (le )?(falta|queda))\b/.test(nf) && timers.length){
    const t=[...timers].sort((a,b)=>a.end-b.end)[0]; sayFast(text, `Faltan ${durTxt(Math.max(0,Math.round((t.end-Date.now())/1000)))}${t.label?' para '+t.label:''}.`); return true;
  }
  const dur=durFrom(nf);
  if(dur && (isTimer || /^(avisame|despertame|llamame) (en|dentro de) /.test(n0) && n0.split(' ').length<=7)){
    let label=''; const m=text.match(/\bpara\s+(?:que\s+)?(.+?)[.!?¡¿]*$/i); if(m && !/\d/.test(m[1])) label=m[1].trim().toLowerCase();
    if(!label){ const m2=text.match(/\bde\s+(?:el\s+|la\s+|los\s+|las\s+)?([a-záéíóúñ ]{3,40}?)[.!?]*$/i); if(m2 && !/(minuto|segundo|hora|timer|temporizador)/i.test(m2[1])) label=m2[1].trim().toLowerCase(); }
    addTimer(dur, label); sayFast(text, `Listo, timer de ${durTxt(dur)}${label?' para '+label:''}.`, 'wink'); return true;
  }
  // notas
  const nm=text.match(/\b(?:dej[aá](?:le)?|anot[aá]|escrib[ií]|pon[eé]|agreg[aá])\s+(?:una\s+)?nota(?:\s+(?:que\s+dice|diciendo|que))?[:,]?\s+(.{2,})$/i);
  if(nm){ addNota(nm[1]); sayFast(text, 'Anotado.', 'happy'); return true; }
  if(/\b(borra|saca|limpia|elimina)\w* (todas )?(las )?notas\b/.test(nf)){ const n=notas.length; notas=[]; saveNotas(); sayFast(text, n?'Listo, borré las notas.':'No había notas.'); return true; }
  if(/\b(lee|leeme|decime|cuales son|que dicen|hay) (las |alguna )?notas?\b/.test(nf)){ sayFast(text, notas.length ? (notas.length===1?'Hay una nota: ':`Hay ${notas.length} notas. `)+notas.map(x=>x.t).join('. ')+'.' : 'No hay notas.'); return true; }
  // la lista de compras
  const ag=text.match(/^(?:friday,?\s*)?(?:agreg[aá]|anot[aá]|sum[aá]|pon[eé])(?:me|le)?\s+(.+?)\s+(?:a|en)\s+la\s+lista(?:\s+de\s+(?:compras|(?:l[ao]s?\s+)?(?:super|supermercado)))?[.!]*$/i);
  if(ag){ const items=ag[1].split(/,|\sy\s|;/).map(s=>s.trim()).filter(Boolean); shopAdd(items); sayFast(text, `Listo, agregué ${listaY(items)}.`, 'happy'); return true; }
  const qt=text.match(/^(?:friday,?\s*)?(?:sac[aá]|borr[aá]|quit[aá]|tach[aá])\s+(.+?)\s+de\s+la\s+lista[.!]*$/i);
  if(qt){ const items=qt[1].split(/,|\sy\s|;/).map(s=>s.trim()).filter(Boolean); const n=shopDel(items); sayFast(text, n?`Listo, saqué ${listaY(items)}.`:'Eso no estaba en la lista.'); return true; }
  if(/\b(que (hay|tengo|falta) (en la lista|que comprar|para comprar)|lee(me)? la lista|que dice la lista)\b/.test(nf)){ const p=compras.filter(x=>!x.h).map(x=>x.t); focusCard('shop'); sayFast(text, p.length?`En la lista hay ${listaY(p)}.`:'La lista está vacía.'); return true; }
  // la casa
  const cf=casaFast(nf);
  if(cf){ pushHist('user', text); setMode('thinking'); casaDo(cf.quien, cf.q).then(r=>{ setMode('idle'); say(r.txt, r.ok?'happy':'worried'); focusCard('casa'); }); return true; }
  // la música (botones)
  if(music.cur && /^(pausa|pausá|paus[aá] la musica|par[aá] la musica|cortala|apaga la musica|saca la musica)$/.test(n0)){ musicCtrl('pausa'); return true; }
  if(music.cur && /^(segui|seguí|play|dale play|reanuda|segui con la musica|volve a poner la musica)$/.test(n0)){ musicCtrl('seguir'); return true; }
  if(music.cur && /^(siguiente|pasa(la)?|otro tema|cambia(la)? de tema|el que sigue)$/.test(n0)){ musicCtrl('siguiente'); return true; }
  if(music.cur && /\b(subi|baja)\w* (el )?volumen\b|^volumen (al )?\d+/.test(n0)){ const v=(n0.match(/\d+/)||[])[0]; musicCtrl('volumen', v || (/subi/.test(n0)?'subir':'bajar')); return true; }
  // configurar de nuevo (Cloudflare, Google, Spotify…) desde el celu
  if(/\b(configura|configurar|vincula|vincular)\w* (la tablet|el panel|a? ?friday)\b|\bmostra(me)? (el )?(codigo|qr)\b/.test(nf)){ sayFast(text, 'Dale: escaneá el código con el celu.'); setTimeout(()=>setupShow(true), 1500); return true; }
  // el cielo
  if(/\b(mostra(me)?|pone(me)?|quiero ver) (el|como esta el) cielo\b|\bmodo (ambiente|demo)\b/.test(nf)){ sayFast(text, 'Mirá.', 'happy'); setTimeout(()=>ambOn(true), 1200); return true; }
  return false;
}
const listaY=xs=>xs.length<2?(xs[0]||''):xs.slice(0,-1).join(', ')+' y '+xs[xs.length-1];

// ---------------------------------------------------------------- timers y recordatorios
function saveTimers(){ LS.set('timers',timers); render(); }
function addTimer(secs, label){ timers.push({id:Date.now().toString(36), label, end:Date.now()+secs*1000, dur:secs}); saveTimers(); }
let ringing=null;
function timerRinging(){ return !!ringing; }
function timerHush(){ if(ringing){ clearInterval(ringing.t); ringing=null; render(); } }
function checkTimers(){
  const now=Date.now(), due=timers.filter(t=>t.end<=now);
  if(due.length){
    timers=timers.filter(t=>t.end>now); saveTimers();
    for(const t of due){
      ambOff(); timerHush(); chime('alarm');
      ringing={label:t.label, n:0, t:setInterval(()=>{ if(!ringing) return; if(++ringing.n>=6){ timerHush(); return; } chime('alarm'); }, 4000)};
      setTimeout(()=>say(`${S.name?S.name+', t':'T'}erminó el timer${t.label?' de '+t.label:''}.`, 'excited'), 1300);
    }
  }
  for(const r of reminders){
    if(r.done || !r.at) continue; const at=new Date(r.at).getTime();
    if(at<=now && now-at<15*60000 && !r.fired){

function tuyaFind(devs, quien){
  const q=norm(quien), out=[], todas=!q || /\btodas?\b|\btodo\b/.test(q), plural=/\b(luces|lamparas|focos)\b/.test(q);

  try{ const st=await sp('GET','/me/player/currently-playing'); if(st && st.item){ const it=st.item; music.cur=Object.assign(music.cur,{title:it.name, artist:(it.artists||[]).map(a=>a.name).join(', '), img:it.album?.images?.[0]?.url||'', prog:st.progress_ms/(it.duration_ms||1), playing:st.is_playing}); render(); } }catch(e){}
  music.spT=setTimeout(spPoll, 6000);
}
// YouTube: la tablet es el parlante
function ytLoad(){
  return new Promise(res=>{
    if(music.ytReady) return res(true);
    window.onYouTubeIframeAPIReady=()=>{ music.yt=new YT.Player('ytp',{width:'100%', height:'100%', playerVars:{autoplay:1, controls:0, playsinline:1, rel:0, modestbranding:1, disablekb:1},
      events:{ onReady:()=>{ music.ytReady=true; res(true); }, onStateChange:e=>{ if(e.data===0) ytNext(); if(e.data===1 && music.cur){ music.cur.playing=true; render(); } if(e.data===2 && music.cur){ music.cur.playing=false; render(); } }, onError:()=>ytNext(true) } }); };
    const s=document.createElement('script'); s.src=API.yt; s.onerror=()=>res(false); document.head.appendChild(s);
    setTimeout(()=>res(music.ytReady), 9000);
  });
}
async function ytPlayQuery(que){
  if(!workerOn()) throw new Error('para poner música en la tablet me falta el servicio de la casa (se arma desde el celu)');
  const r=await wk('/yt?q='+encodeURIComponent(que));
  if(!r.ok || !(r.videos||[]).length) throw new Error(`no encontré "${que}" en YouTube`);
  music.list=r.videos; music.idx=0;
  if(!await ytLoad()) throw new Error('YouTube no carga en esta tablet');
  ytStart(); return r.videos[0];
}
function ytStart(){
  const v=music.list[music.idx]; if(!v) return;
  music.cur={src:'youtube', title:v.title, artist:v.by||'', img:`https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`, id:v.id, playing:true, at:Date.now()};
  try{ music.yt.loadVideoById(v.id); music.yt.setVolume(music.vol); }catch(e){}
  render();
}
function ytNext(err){ if(!music.list.length) return; music.idx++; if(music.idx>=music.list.length){ if(!err){ music.cur=null; render(); } return; } ytStart(); }
function duck(on){ try{ if(music.cur && music.cur.src==='youtube' && music.yt) music.yt.setVolume(on?Math.round(music.vol*0.25):music.vol); }catch(e){} }
async function playMusic(que, tipo, donde){
  const wantYT=/youtube|tablet|aca|parlante/.test(norm(donde||'')+' '+norm(tipo||'')), wantSP=/spotify/.test(norm(donde||'')+' '+norm(tipo||''));
  const useSP = wantSP || (!wantYT && spOn() && S.music!=='youtube');
  if(useSP && !spOn()) throw new Error('Spotify no está conectado: se conecta desde el celu, en la configuración de la tablet');
  if(useSP){ if(music.cur && music.cur.src==='youtube'){ try{ music.yt.pauseVideo(); }catch(e){} } const i=await spPlayQuery(que, tipo); return `Dale, ${i.nombre}${i.artista?' de '+i.artista:''} en Spotify.`; }
  if(music.cur && music.cur.src==='spotify'){ sp('PUT','/me/player/pause').catch(()=>{}); }
  const v=await ytPlayQuery(que); return `Dale, pongo ${String(v.title||que).replace(/\s*[\(\[].*?[\)\]]/g,'').slice(0,80)}.`;
}
async function musicCtrl(cmd, val){
  const c=norm(cmd), m=music.cur; if(!m){ say('No está sonando nada.'); return; }
  try{
    if(m.src==='youtube'){
      if(/paus|para|stop/.test(c)){ music.yt.pauseVideo(); m.playing=false; }
      else if(/segui|play|reanud/.test(c)){ music.yt.playVideo(); m.playing=true; }
      else if(/sig|pasa|next/.test(c)) ytNext();
      else if(/ant|prev/.test(c)){ music.idx=Math.max(0,music.idx-1); ytStart(); }
      else if(/vol/.test(c)){ let n=parseInt(val); if(isNaN(n)) n=/sub|mas/.test(norm(val))?music.vol+20:music.vol-20; music.vol=Math.max(5,Math.min(100,n)); music.yt.setVolume(music.vol); }
    } else {
      if(/paus|para|stop/.test(c)){ await sp('PUT','/me/player/pause'); m.playing=false; }
      else if(/segui|play|reanud/.test(c)){ await sp('PUT','/me/player/play'); m.playing=true; }
      else if(/sig|pasa|next/.test(c)) await sp('POST','/me/player/next');
      else if(/ant|prev/.test(c)) await sp('POST','/me/player/previous');
      else if(/vol/.test(c)){ let n=parseInt(val); if(isNaN(n)){ const st=await sp('GET','/me/player'); const cur=st?.device?.volume_percent??50; n=/sub|mas/.test(norm(val))?cur+15:cur-15; } await sp('PUT','/me/player/volume',null,{volume_percent:Math.max(0,Math.min(100,n))}); }
      setTimeout(spPoll, 900);
    }
    render(); focusCard('mus'); if(/sig|pasa|ant/.test(c)) faceSet('wink',1200);
  }catch(e){ say('No pude: '+e.message, 'worried'); }
}

async function gToken(){

  const r=await wk('/google/token',{body:{rt:S.google.rt}}); if(!r.ok) throw new Error(r.error||'Google no respondió');
  gapp.at=r.access_token; gapp.exp=Date.now()+(r.expires_in-60)*1000; return gapp.at;
}
async function gfetch(url, opts={}){
  const t=await gToken(); const r=await fetch(url,{method:opts.method||'GET', headers:Object.assign({Authorization:'Bearer '+t}, opts.body?{'Content-Type':'application/json'}:{}), body:opts.body?JSON.stringify(opts.body):undefined});
  const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error((d.error&&d.error.message)||('Google '+r.status)); return d;
}

function agendaText(cuando){
  const now=new Date(), d0=new Date(now); d0.setHours(0,0,0,0);
  const dayOf=e=>{ const x=new Date(e.d?e.i+'T00:00':e.i); x.setHours(0,0,0,0); return Math.round((x-d0)/86400000); };
  const want=/manana/.test(norm(cuando||''))?[1]:/seman/.test(norm(cuando||''))?[0,1,2]:[0];
  const ev=gapp.ev.filter(e=>want.includes(dayOf(e)));
  if(!ev.length) return want.length>1?'No hay nada en la agenda estos días.':want[0]===1?'Mañana no hay nada en la agenda.':'Hoy no hay nada en la agenda.';
  return ev.map(e=>{ const k=dayOf(e), dia=k===0?'hoy':k===1?'mañana':'pasado mañana'; return e.d?`${dia} todo el día: ${e.t}`:`${dia} a las ${hhmm(new Date(e.i))}: ${e.t}${e.l?' en '+e.l:''}`; }).join('; ')+'.';
}

const MODELS=['llama-3.3-70b-versatile','openai/gpt-oss-120b','openai/gpt-oss-20b','llama-3.1-8b-instant'];
const tired={};
function prompt(){
  const now=new Date(), fecha=now.toLocaleDateString('es-AR',{weekday:'long', day:'numeric', month:'long'})+', '+hhmm(now);
  const L=[];
  L.push(`Sos FRIDAY, la asistente de voz de la casa de ${S.name||'la familia'}${S.city?' en '+S.city:''}. Vivís en una tablet en la casa. Hablás en español rioplatense: cálida, rápida, segura y con humor fino. Todo lo que escribís se dice en voz alta: frases cortas, sin markdown, sin emojis, sin listas; los números y horas como se dicen. Respondé en 1 a 3 frases salvo que pidan más.`);
  L.push(`Ahora: ${fecha}. Clima en ${S.city||'tu ciudad'}: ${weatherText()}`);
  if(gapp.ev.length) L.push('Agenda: '+agendaText('semana'));
  const rp=reminders.filter(r=>!r.done && new Date(r.at)>now).sort((a,b)=>new Date(a.at)-new Date(b.at)).slice(0,5); if(rp.length) L.push('Recordatorios: '+rp.map(r=>`${r.at.replace('T',' ')} ${r.texto}`).join('; '));
  if(timers.length) L.push('Timers andando: '+timers.map(t=>`${t.label||'timer'} (faltan ${durTxt(Math.round((t.end-Date.now())/1000))})`).join('; '));
  const p=compras.filter(x=>!x.h).map(x=>x.t); L.push('Lista de compras: '+(p.length?p.join(', '):'vacía'));
  if(notas.length) L.push('Notas de la casa: '+notas.map(n=>n.t).join('; '));
  if(casa.devs.length) L.push('Aparatos de la casa: '+casa.devs.map(d=>`${d.nombre} (${d.tipo}, ${devOn(d)?'prendido':'apagado'}${d.online?'':', desconectado'})`).join('; '));
  if(music.cur) L.push(`Música: ${music.cur.playing===false?'en pausa':'sonando'} "${music.cur.title}"${music.cur.artist?' de '+music.cur.artist:''} (${music.cur.src}).`);
  const cs=cumplesProx(); if(cs.length) L.push('Cumpleaños próximos: '+cs.map(c=>`${c.n} (${c.dias===0?'HOY':c.dias===1?'mañana':'en '+c.dias+' días'})`).join(', '));
  if(memory.length) L.push('Lo que sabés de la familia: '+memory.slice(-25).join('; '));
  const tags=['[[TIMER|segundos|para qué]]','[[RECORDAR|AAAA-MM-DDTHH:MM|qué]]','[[COMPRAS|agregar o quitar o tachar o vaciar|cosa; cosa]]','[[NOTA|texto]] (nota visible en la tablet)','[[MEMORIA|dato importante y duradero de la familia]]'];
  if(casa.devs.length) tags.push('[[CASA|qué aparato|prender o apagar o brillo 40 o color azul o blanco cálido o limpiar]]');
  tags.push('[[MUSICA|qué poner|tema o artista o disco o playlist|spotify o youtube (si lo pidió)]]','[[MUSICA_CTRL|pausa o seguir o siguiente o anterior o volumen|valor]]');
  tags.push('[[BUSCAR|consulta]] para datos actuales (resultados, precios, horarios, noticias de algo puntual): no inventes','[[NOTICIAS]] para los titulares de hoy');
  if(googleOn()) tags.push('[[EVENTO|título|AAAA-MM-DDTHH:MM|minutos]] para anotar en la agenda de Google','[[MAILS]] para leer los mails nuevos importantes');
  tags.push('[[CARA|feliz o risa o enamorada o sorprendida o triste o preocupada o pensativa o guiño o canchera o confundida o emocionada o orgullosa]] tu cara mientras hablás');
  L.push('Para hacer cosas agregá marcas al final de tu respuesta (no se leen en voz alta): '+tags.join(' · ')+'. Usalas solo si hace falta, y confirmá en una frase corta lo que hiciste. Si no podés algo, decilo sin vueltas.');
  return L.join('\n');

async function llm(messages, onDelta){
  const ctl=new AbortController(); state.ctl=ctl;
  let lastErr='';
  for(const model of MODELS){
    if((tired[model]||0)>Date.now()) continue;
    try{
      const body={model, messages, stream:true, temperature:.7, max_completion_tokens:600};
      if(/gpt-oss/.test(model)) body.reasoning_effort='low';
      const r=await fetch(API.groq+'/chat/completions',{method:'POST', signal:ctl.signal, headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.groqKey}, body:JSON.stringify(body)});
      if(r.status===429 || r.status===413 || r.status>=500){ const tx=await r.text().catch(()=>''); tired[model]=Date.now()+(r.status===429?Math.min(30*60000,retryMs(tx,r)):60000); lastErr='Groq '+r.status; continue; }
      if(!r.ok){ lastErr='Groq '+r.status; if(r.status===401) throw new Error('llave'); continue; }
      const rd=r.body.getReader(), dec=new TextDecoder(); let buf='', out='';
      while(true){ const {value,done}=await rd.read(); if(done) break; buf+=dec.decode(value,{stream:true}); let i;
        while((i=buf.indexOf('\n'))>=0){ const ln=buf.slice(0,i).trim(); buf=buf.slice(i+1); if(!ln.startsWith('data:')) continue; const p=ln.slice(5).trim(); if(p==='[DONE]') continue;
          try{ const d=JSON.parse(p).choices?.[0]?.delta?.content; if(d){ out+=d; onDelta(out); } }catch(e){} } }
      return out;
    }catch(e){ if(e.name==='AbortError') throw e; if(e.message==='llave') throw new Error('La llave de Groq no anda: revisala desde el celu.'); lastErr=e.message; }
  }
  if(S.gemKey){
    for(const gm of ['gemini-2.5-flash','gemini-2.0-flash']){
      try{ const sys=messages.find(m=>m.role==='system'); const contents=messages.filter(m=>m.role!=='system').map(m=>({role:m.role==='assistant'?'model':'user', parts:[{text:m.content}]}));
        const r=await fetch(`${API.gem}/models/${gm}:generateContent?key=${S.gemKey}`,{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({systemInstruction:{parts:[{text:sys.content}]}, contents})});
        if(!r.ok) continue; const d=await r.json(); const t=(d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join(''); if(t){ onDelta(t); return t; } }catch(e){}
    }
  }
  const next=Math.min(...MODELS.map(m=>tired[m]||Infinity));
  throw new Error(isFinite(next) && next>Date.now() ? `Se me acabó el cupo gratis del cerebro por un rato; vuelvo ${next-Date.now()<120000?'en un minuto':'a las '+hhmm(new Date(next))}.` : 'No me pude conectar con el cerebro. ¿Hay internet?');
}
const TAG_RE=/\[\[([A-ZÁÉÍÓÚ_]+)(?:\|([^\]]*))?\]\]/g;
async function brain(text, extra, depth=0){
  if(!S.groqKey && !S.gemKey){ say('Me falta la llave del cerebro: se carga desde el celu.'); return; }
  setMode('thinking'); stopTalk(); tts.shown=''; tts.said=''; $('her').textContent='';
  const msgs=[{role:'system', content:prompt()}, ...hist.slice(-8)];
  if(extra) msgs.push({role:'user', content:extra});
  let spokenUpTo=0, full='';
  const onDelta=out=>{
    full=out;
    const vis=out.replace(TAG_RE,'').replace(/\[\[[^\]]*$/,'');
    tts.shown=spokenForm(vis); showHer();
    // habla de a frases mientras piensa el resto
    const upto=vis.slice(spokenUpTo); const m=upto.match(/^[\s\S]*?[.!?](\s|$)/);
    if(m){ const chunk=m[0]; spokenUpTo+=chunk.length; if(state.mode==='thinking') setMode('speaking'); speakChunk(chunk); }
  };
  try{ full=await llm(msgs, onDelta); }
  catch(e){ if(e.name==='AbortError') return; setMode('idle'); say(e.message, 'worried'); return; }
  const vis=full.replace(TAG_RE,'').trim(); const rest=vis.slice(spokenUpTo); if(rest.trim()) speakChunk(rest);
  tts.shown=spokenForm(vis); showHer();
  if(vis) pushHist('assistant', full);
  if(!tts.on && !tts.q.length) setMode('idle');
  // las marcas
  const tags=[...full.matchAll(TAG_RE)].map(m=>({k:m[1].toUpperCase(), a:(m[2]||'').split('|').map(s=>s.trim())}));
  const notes=[];
  for(const t of tags){
    try{
      if(t.k==='CARA') faceSet(t.a[0], 4000);
      else if(t.k==='TIMER'){ const s=+t.a[0]||durFrom(norm(t.a[0])); if(s) addTimer(s, t.a[1]||''); }
      else if(t.k==='RECORDAR'){ if(t.a[0] && t.a[1]) addReminder(t.a[0], t.a[1]); }
      else if(t.k==='COMPRAS'){ const op=norm(t.a[0]), items=(t.a[1]||'').split(/;|,/).map(s=>s.trim()).filter(Boolean); if(/vaci/.test(op)){ compras=[]; shopSave(); } else if(/quit|saca|borr/.test(op)) shopDel(items); else if(/tach|compr/.test(op)){ for(const x of compras) if(items.some(i=>norm(x.t).includes(norm(i)))) x.h=true; shopSave(); } else shopAdd(items); }
      else if(t.k==='NOTA') addNota(t.a[0]);
      else if(t.k==='MEMORIA'){ const d=t.a[0]; if(d && !memory.some(m=>norm(m)===norm(d))){ memory.push(d); memory=memory.slice(-80); LS.set('memory',memory); try{ FSync.scan(); }catch(e){} } }
      else if(t.k==='CASA'){ const r=await casaDo(t.a[0], t.a.slice(1).join(' ')); if(!r.ok) notes.push('Casa: '+r.txt); else focusCard('casa'); }
      else if(t.k==='MUSICA'){ await playMusic(t.a[0], t.a[1], t.a[2]); focusCard('mus'); }
      else if(t.k==='MUSICA_CTRL') await musicCtrl(t.a[0], t.a[1]);
      else if(t.k==='BUSCAR'){ const r=await search(t.a[0]); notes.push(r?`Lo que encontraste sobre "${t.a[0]}": ${r}`:`No encontraste nada sobre "${t.a[0]}": decilo, no inventes.`); }
      else if(t.k==='NOTICIAS'){ const n=await news(); notes.push(n.length?'Titulares de hoy: '+n.join(' | '):'No pude traer las noticias.'); }
      else if(t.k==='EVENTO'){ await agendaAdd(t.a[0], t.a[1], t.a[2]); focusCard('hoy'); }
      else if(t.k==='MAILS'){ const m=await mailsLoad(true); notes.push(m.length?'Mails nuevos: '+m.map(x=>`de ${x.de}: ${x.asunto} (${x.snip})`).join(' | '):'No hay mails nuevos importantes.'); }
      else if(t.k==='AGENDA'){ await agendaLoad(true); notes.push('Agenda: '+agendaText(t.a[0])); }
    }catch(e){ notes.push(`No pudiste hacer ${t.k.toLowerCase()}: ${e.message==='sin_spotify_abierto'?'Spotify no está abierto en ningún aparato':e.message}`); }
  }
  if(notes.length && depth<1){
    const waitSpeak=async()=>{ for(let i=0;i<60 && (tts.on||tts.q.length);i++) await sleep(150); };
    await waitSpeak();
    brain(null, '(Resultado de lo que hiciste; no lo dijo el usuario)\n'+notes.join('\n')+'\nContáselo breve y natural.', depth+1);
  }
}

// ---------------------------------------------------------------- cumpleaños
function cumplesProx(){

function syncApply(changes){

    else if(k==='r'){ const i=reminders.findIndex(r=>String(r.id)===key); if(c.d){ if(i>=0) reminders.splice(i,1); } else if(v){ const r={id:key, at:v.at, texto:v.texto, rep:v.rep, done:!!v.done, push:!!v.push}; if(i>=0) reminders[i]=Object.assign(reminders[i], r); else reminders.push(r); } LS.set('rems',reminders); ch=true; }

  faceBuild($('face')); faceSet('idle'); faceBlink(); applyLight(); render();
  try{ if(navigator.serviceWorker && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
  await FSync.init({ store:(k,v)=>LS.set(k,v), load:k=>LS.get(k,null), dev:DEV, name:'Tablet de la casa', kinds:['m','r','l','b','o'], pollMs:60000, live:true,
    local:syncLocal, apply:syncApply, onMsg, onStatus:renderStatus });
  if(setupCheck()) $('tap').hidden=false;
  getWeather(); casaLoad(); agendaLoad(); mailsLoad();
  $('tap').onclick=start; $('sClose').onclick=()=>{ $('setup').hidden=true; setupShow.force=false; };
  setInterval(()=>{ render(); checkTimers(); if(amb.on) ambTick(); }, 1000);
  setInterval(()=>{ applyLight(); agendaCheck(); }, 30000);
  setInterval(()=>{ if(!amb.on && state.started && state.mode==='idle' && !speakingNow() && Date.now()-state.lastUser>150000) ambOn(); }, 5000);
  setInterval(()=>{ getWeather(); casaLoad(); agendaLoad(); mailsLoad(); }, 5*60000);
  // si te quedó la respuesta escrita mucho rato, se limpia
  setInterval(()=>{ if(!speakingNow() && state.mode==='idle' && Date.now()-tts.lastEnd>45000 && Date.now()-state.lastUser>45000 && $('her').textContent){ $('her').textContent=''; $('you').textContent=''; renderHint(); } }, 5000);
  addEventListener('online', ()=>{ renderStatus(); FSync.kick && FSync.kick(); }); addEventListener('offline', renderStatus);
}
boot();

</script>
