<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRIDAY Tele</title>
<meta name="theme-color" content="#071425">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* hecho para el navegador de las teles LG con webOS 4 (Chromium 53): flexbox con márgenes, sin grid ni gap */
:root{--ink:#071425;--card:rgba(255,255,255,.055);--line:rgba(120,190,255,.22);--accent:#4cc9ff;--accent2:#ffb547;--text:#eaf6ff;--muted:#8fb0c8;
  --disp:"Fredoka","Trebuchet MS",sans-serif;--txt:"Nunito","Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#071425;color:var(--text);font-family:var(--txt);-webkit-font-smoothing:antialiased;cursor:default}
body{background:radial-gradient(ellipse at 18% 30%,rgba(76,201,255,.16),transparent 55%),radial-gradient(ellipse at 90% 90%,rgba(255,181,71,.08),transparent 50%),#071425}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;outline:none}
.sutil{color:var(--muted)}
.pant{display:none;position:absolute;top:0;left:0;right:0;bottom:0;padding:4vh 4vw}
.pant.on{display:-webkit-flex;display:flex}
.f{-webkit-transition:-webkit-transform .15s,box-shadow .15s,background .15s;transition:transform .15s,box-shadow .15s,background .15s}
.f.foco{-webkit-transform:scale(1.06);transform:scale(1.06);box-shadow:0 0 0 .25vw var(--accent),0 0 2.4vw rgba(76,201,255,.55);background:rgba(76,201,255,.22)}
.bt{padding:1.3vw 2.2vw;margin:0 1.2vw 1.2vw 0;border-radius:1.3vw;background:var(--card);border:.1vw solid var(--line);font-size:1.6vw;font-weight:800}
.fila{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-align-items:center;align-items:center;margin-top:1.4vw}
.card{background:var(--card);border:.1vw solid var(--line);border-radius:1.6vw;padding:1.4vw 1.8vw;margin-bottom:1.3vw}
.card h3{margin:0 0 .6vw;font:600 1.25vw var(--disp);letter-spacing:.08vw;text-transform:uppercase;color:var(--accent)}
.card ul{list-style:none;margin:0;padding:0}.card li{font-size:1.6vw;margin:.45vw 0;line-height:1.3}.card li b{display:inline-block;min-width:7.5vw;color:var(--accent2);font-weight:800}
.card p{margin:.3vw 0;font-size:1.5vw;line-height:1.35}.card .lista{font-size:1.55vw}

/* el arranque */
#arranque{position:fixed;top:0;left:0;right:0;bottom:0;z-index:99;background:#071425;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;-webkit-transition:opacity .6s;transition:opacity .6s}
#arranque.chau{opacity:0}#arranque b{font:700 5vw var(--disp);letter-spacing:.4vw;color:var(--accent)}

/* unir */
#p-unir{-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;text-align:center}
#caraU{width:28vw;height:23vw;margin-bottom:-1.5vw}
#p-unir h1{font:700 3.6vw var(--disp);margin:.6vw 0 .4vw}
#p-unir .paso{font-size:1.8vw;color:var(--muted);margin:.4vw 0;max-width:60vw;line-height:1.4}
#p-unir .paso b{color:var(--text)}
#uCod{font:700 6vw 'Courier New',monospace;letter-spacing:.8vw;padding:1.4vw 3vw;margin:1.6vw 0;border-radius:1.6vw;background:rgba(76,201,255,.12);border:.15vw solid var(--line);color:#fff}

/* inicio */
#p-inicio{-webkit-flex-direction:row;flex-direction:row}
.izq{width:38vw;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;text-align:center;padding-top:1vh}
#cara{width:36vw;height:30vw;margin:-2vw 0 -2.4vw}
#iHola{font:600 2.6vw var(--disp);margin:.4vw 0 0}
#iHora{font:600 9vw/1 var(--disp);letter-spacing:-.2vw;margin:.8vw 0 .2vw}
#iFecha{font-size:1.9vw;color:var(--muted);text-transform:capitalize}
#iEstado{margin-top:1.6vw;font-size:1.3vw;color:var(--muted)}
.pto{display:inline-block;width:.8vw;height:.8vw;border-radius:50%;background:#7a8a99;margin-right:.6vw;vertical-align:middle}.pto.ok{background:#5be39b;box-shadow:0 0 .8vw #5be39b}
.der{-webkit-flex:1;flex:1;padding-left:3vw;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.wxg .sutil{font-size:1.35vw}.wxg{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}.wxe{font-size:4.6vw;margin-right:1.4vw}.wxt{font:600 4.2vw/1 var(--disp)}
.wxh{display:-webkit-flex;display:flex;margin-top:1vw}.wxh div{-webkit-flex:1;flex:1;text-align:center;font-size:1.3vw;color:var(--muted)}.wxh b{display:block;font-size:2vw;font-weight:400;margin:.2vw 0}
.der .fila{margin-top:auto}

/* capas */
.capa{display:none;position:fixed;z-index:20}
.capa.on{display:block}
#c-charla{left:5vw;right:5vw;bottom:4vh;padding:2vw 2.6vw;border-radius:2vw;background:rgba(6,18,34,.94);border:.12vw solid var(--line);box-shadow:0 1.5vw 5vw rgba(0,0,0,.6)}
#chDe{font-size:1.6vw;color:var(--muted);margin-bottom:.6vw}
#chR{font:600 2.7vw/1.3 var(--disp)}#chR.pensando{color:var(--muted)}
#c-aviso,#c-salir{top:0;left:0;right:0;bottom:0;background:rgba(3,10,20,.82)}
.cajaC{position:absolute;left:50%;top:50%;width:56vw;margin-left:-28vw;-webkit-transform:translateY(-50%);transform:translateY(-50%);text-align:center;padding:3vw;border-radius:2.4vw;background:#0d2238;border:.15vw solid var(--line)}
.cajaC .fila{-webkit-justify-content:center;justify-content:center}
#avI{font-size:6vw}#avT{font:600 2vw var(--disp);color:var(--accent);margin:.6vw 0}#avS{font:600 3.4vw/1.25 var(--disp)}

/* cuento */
#p-cuento,#p-trivia,#p-ajustes{-webkit-flex-direction:column;flex-direction:column}
#cuTit{font:700 3.6vw var(--disp);margin:0 0 1.4vw;color:var(--accent2)}
#cuTxt{-webkit-flex:1;flex:1;overflow:hidden;position:relative;padding-right:2vw}
#cuTxt p{font-size:2.4vw;line-height:1.55;margin:0 0 1.6vw;color:var(--muted);-webkit-transition:color .4s;transition:color .4s}
#cuTxt p.va{color:#fff}

/* trivia */
#trBox{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:center;justify-content:center;padding:0 6vw}
.preg{font:600 3.4vw/1.25 var(--disp);margin:.6vw 0 2vw}
.ops{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.op{width:47%;margin:0 2% 1.4vw 0;padding:1.6vw 2vw;border-radius:1.4vw;background:var(--card);border:.12vw solid var(--line);font-size:2.2vw;text-align:left;font-weight:700}
.op b{display:inline-block;width:3vw;color:var(--accent)}
.op.ok{background:rgba(91,227,155,.25);border-color:#5be39b}.op.mal{background:rgba(255,110,110,.2);border-color:#ff8b8b}
.dato{font-size:2vw;line-height:1.4}.grande{font:600 3.4vw var(--disp);text-align:center}.puntos{font:700 8vw var(--disp);text-align:center;margin:1vw 0;color:var(--accent2)}
#trBox .fila{-webkit-justify-content:center;justify-content:center}#trBox .sutil{font-size:1.6vw;margin:0}

/* reloj grande (protector) */
#p-reloj{-webkit-flex-direction:column;flex-direction:column;background:#020810}
#rHora{font:600 16vw/1 var(--disp);color:rgba(150,200,240,.55)}#rFecha{font-size:2.6vw;color:rgba(150,200,240,.4);text-transform:capitalize}
#p-ajustes h2{font:700 3vw var(--disp);margin:0 0 1.4vw}#ajBox p{font-size:1.8vw}
</style>
</head>
<body>
<div id="arranque"><b>FRIDAY</b></div>

<section class="pant" id="p-unir">
  <canvas id="caraU"></canvas>
  <h1>Hola, soy FRIDAY</h1>
  <p class="paso">Para unirme con tu celu, abrí <b>FRIDAY</b> en el celu → <b>Casa y familia</b> → <b>La tele</b>, y escribí este código:</p>
  <div id="uCod">····-····</div>
  <p class="paso">Hace falta que ya hayas entrado con tu <b>cuenta de BufaLabs</b> en el celu. El código cambia cada 25 minutos.</p>
</section>

<section class="pant" id="p-inicio">
  <div class="izq"><canvas id="cara"></canvas><div id="iHola">Hola</div><div id="iHora">--:--</div><div id="iFecha"></div><div id="iEstado"></div></div>
  <div class="der">
    <div class="card" id="iClima"></div>
    <div class="card" id="iHoy"></div>
    <div class="card" id="iLista"></div>
    <div class="fila"><button class="f bt" id="btCuento" data-pri="1">🌙 Un cuento</button><button class="f bt" id="btTrivia">❓ Trivia en familia</button><button class="f bt" id="btReloj">🕰️ Reloj grande</button><button class="f bt" id="btAjustes">⚙️ Ajustes</button></div>
  </div>
</section>

<section class="pant" id="p-cuento">
  <div id="cuTit"></div><div id="cuTxt"></div>
  <div class="fila"><button class="f bt" id="btCuAnt">⏮ Atrás</button><button class="f bt" id="btCuPausa" data-pri="1">⏸ Pausa</button><button class="f bt" id="btCuSig">⏭ Adelante</button><button class="f bt" id="btCuSalir">✕ Terminar</button></div>
</section>

<section class="pant" id="p-trivia"><div id="trBox"></div></section>
<section class="pant" id="p-reloj"><div id="rHora"></div><div id="rFecha"></div></section>
<section class="pant" id="p-ajustes"><h2>Ajustes</h2><div id="ajBox"></div></section>

<div class="capa" id="c-charla"><div id="chDe"></div><div id="chR"></div></div>
<div class="capa modal" id="c-aviso"><div class="cajaC"><div id="avI"></div><div id="avT"></div><div id="avS"></div><div class="fila"><button class="f bt" id="btAvOk" data-pri="1">Listo</button></div></div></div>
<div class="capa modal" id="c-salir"><div class="cajaC"><div id="avT2" style="font:600 3vw var(--disp)">¿Salir de FRIDAY?</div><div class="fila"><button class="f bt" id="btSalirNo" data-pri="1">No, quedarme</button><button class="f bt" id="btSalirSi">Sí, salir</button></div></div></div>
